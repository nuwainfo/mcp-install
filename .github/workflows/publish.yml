name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main

      - run: python -m pip install --upgrade build twine
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "*Test.py" -v
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release tag and installed distributions
        run: python scripts/ReleaseCheck.py --tag "${{ github.event.release.tag_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
